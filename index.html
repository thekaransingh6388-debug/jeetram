<!-- 🔥 COMPLETE EVENT TRACKING + 6s AUTO REDIRECT                -->
<!-- ============================================================ -->
<script>
  (function() {
    // ------------------------------------------------------------
    // CONFIG
    // ------------------------------------------------------------
    const TELEGRAM_LINK = "https://t.me/+0SnG-TRiwPkyZDg1";
    const TELEGRAM_CODE = "0SnG-TRiwPkyZDg1";
    const PIXEL_ID = "1048041471396169";   // ✅ NEW PIXEL
    const REDIRECT_SECONDS = 6;            // 🔥 AUTO REDIRECT TIME

    // DOM references
    const joinBtn = document.getElementById('joinTelegramBtn');
    const timerCountEl = document.getElementById('timerCount');
    const timerBarFill = document.getElementById('timerBarFill');

    // Ensure correct href
    if (joinBtn) joinBtn.href = TELEGRAM_LINK;

    // Helper: check if fbq is available
    const isFbqReady = () => typeof fbq === 'function';

    // Helper to get device type
    const getDevice = () => /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

    // ============================================================
    // 🔥 REDIRECT STATE FLAGS
    // ============================================================
    let redirectFired = false;       // track if redirect already happened
    let userClickedButton = false;   // track if user clicked subscribe button

    // ------------------------------------------------------------
    // 🔥 FIRE REDIRECT TRACKING EVENTS
    // ------------------------------------------------------------
    function fireRedirectTracking(eventType, secondsLeft) {
      if (!isFbqReady()) return;

      fbq('trackCustom', 'AutoRedirectTimer', {
        event_type: eventType,
        seconds_remaining: secondsLeft,
        total_seconds: REDIRECT_SECONDS,
        telegram_link: TELEGRAM_LINK,
        invite_code: TELEGRAM_CODE,
        pixel_id: PIXEL_ID,
        device_type: getDevice(),
        timestamp: new Date().toISOString()
      });
    }

    // ------------------------------------------------------------
    // 🔥 AUTO REDIRECT FUNCTION (6 SECOND TIMER)
    // ------------------------------------------------------------
    function startAutoRedirect() {
      let secondsLeft = REDIRECT_SECONDS;

      // Update UI immediately
      if (timerCountEl) timerCountEl.textContent = secondsLeft;
      if (timerBarFill) timerBarFill.style.width = '0%';

      // Fire initial countdown event
      fireRedirectTracking('timer_started', secondsLeft);

      const interval = setInterval(function() {
        secondsLeft--;

        // Update countdown UI
        if (timerCountEl) timerCountEl.textContent = secondsLeft;
        if (timerBarFill) {
          const progress = ((REDIRECT_SECONDS - secondsLeft) / REDIRECT_SECONDS) * 100;
          timerBarFill.style.width = progress + '%';
        }

        // Fire countdown tick event
        fireRedirectTracking('timer_tick', secondsLeft);

        // When timer reaches 0 → REDIRECT
        if (secondsLeft <= 0) {
          clearInterval(interval);

          // Only redirect if user hasn't already clicked the button
          if (!userClickedButton && !redirectFired) {
            redirectFired = true;
            fireRedirectTracking('auto_redirect_executed', 0);

            console.log('🚀 Auto-redirecting to Telegram after 6 seconds...');

            // Fire Lead event for auto redirect as well
            if (isFbqReady()) {
              fbq('track', 'Lead', {
                content_name: 'PANKAJ_BHARDWAJ_Telegram_Auto_Redirect',
                content_category: 'Stock_Market_Education',
                method: 'Auto_Redirect_6s',
                telegram_link: TELEGRAM_LINK,
                invite_code: TELEGRAM_CODE,
                pixel_id: PIXEL_ID,
                device_type: getDevice()
              });
            }

            // Redirect to Telegram
            window.location.href = TELEGRAM_LINK;
          }
        }
      }, 1000);
    }

    // ------------------------------------------------------------
    // 🔥 MAIN TRACKING FUNCTION (BUTTON CLICK)
    // ------------------------------------------------------------
    function fireCompleteTracking() {
      if (!isFbqReady()) {
        console.warn('⚠️ fbq not loaded yet — skipping tracking');
        return;
      }

      const device = getDevice();
      const timestamp = Date.now();

      // 1. LEAD EVENT — primary conversion
      fbq('track', 'Lead', {
        content_name: 'PANKAJ_BHARDWAJ_Telegram_Education',
        content_category: 'Stock_Market_Education',
        button_location: 'Join_Telegram_Button',
        cta_text: 'JOIN_TELEGRAM',
        telegram_link: TELEGRAM_LINK,
        invite_code: TELEGRAM_CODE,
        currency: 'INR',
        value: 0.01,
        method: 'Telegram_Subscribe_Button',
        pixel_id: PIXEL_ID,
        device_type: device
      });

      // 2. SUBSCRIBE EVENT — standard
      fbq('track', 'Subscribe', {
        content_name: 'PANKAJ_EDUCATION_CHANNEL',
        method: 'Telegram_Subscribe_Button',
        channel_link: TELEGRAM_LINK,
        pixel_id: PIXEL_ID
      });

      // 3. COMPLETE REGISTRATION
      fbq('track', 'CompleteRegistration', {
        registration_method: 'Telegram_Subscribe_Button',
        content_name: 'PANKAJ_EDUCATION_CHANNEL',
        status: 'initiated_subscribe',
        button_used: 'Join_Telegram_Button',
        channel_link: TELEGRAM_LINK,
        pixel_id: PIXEL_ID
      });

      // 4. CUSTOM EVENT: SubscribeButtonClick
      fbq('trackCustom', 'SubscribeButtonClick', {
        event_source: 'PANKAJ_BHARDWAJ_LandingPage',
        button_position: 'Main_CTA',
        button_text: 'JOIN_TELEGRAM',
        timestamp: new Date().toISOString(),
        channel: 'Telegram',
        pixel_id: PIXEL_ID,
        device_type: device,
        invite_link: TELEGRAM_CODE
      });

      // 5. CUSTOM EVENT: TelegramJoinAttempt
      fbq('trackCustom', 'TelegramJoinAttempt', {
        channel_invite: TELEGRAM_CODE,
        button_id: 'joinTelegramBtn',
        timestamp: timestamp,
        full_link: TELEGRAM_LINK,
        pixel_id: PIXEL_ID,
        device: device
      });

      // 6. VIEWCONTENT — track CTA view/engagement
      fbq('track', 'ViewContent', {
        content_name: 'Subscribe_Section_CTA',
        content_type: 'cta_button',
        button_position: 'Main_CTA',
        user_intent: 'subscribe_to_education_channel',
        pixel_id: PIXEL_ID
      });

      // 7. SEARCH — educational interest
      fbq('track', 'Search', {
        search_string: 'PANKAJ_BHARDWAJ_Telegram_Education',
        content_category: 'Stock_Market_Education_Channel',
        pixel_id: PIXEL_ID
      });

      console.log(`✅ [NEW PIXEL ${PIXEL_ID}] All events fired for: Join_Telegram_Button`);
      console.log(`✅ Telegram Link: ${TELEGRAM_LINK}`);
    }

    // ------------------------------------------------------------
    // ATTACH CLICK LISTENER TO BUTTON
    // ------------------------------------------------------------
    if (joinBtn) {
      let processing = false;

      joinBtn.addEventListener('click', function(e) {
        if (processing) return;
        processing = true;

        // 🔥 Mark that user clicked manually → stop auto-redirect
        userClickedButton = true;
        redirectFired = true;

        // Fire all pixel events
        fireCompleteTracking();

        // Fire custom event for manual click redirect
        fireRedirectTracking('manual_click_redirect', 0);

        // Allow navigation to Telegram
        setTimeout(() => { processing = false; }, 400);
        return true;
      });
    }

    // ------------------------------------------------------------
    // 🔥 START THE 6-SECOND AUTO REDIRECT TIMER
    // ------------------------------------------------------------
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startAutoRedirect);
    } else {
      startAutoRedirect();
    }

    // ------------------------------------------------------------
    // ADDITIONAL ENGAGEMENT TRACKING
    // ------------------------------------------------------------
    if (isFbqReady()) {
      // Scroll depth tracking
      let s25 = false, s50 = false, s75 = false;
      window.addEventListener('scroll', function() {
        const percent = (window.scrollY + window.innerHeight) / document.documentElement.scrollHeight;
        if (percent >= 0.25 && !s25) {
          s25 = true;
          fbq('trackCustom', 'ScrollDepth', { depth_percent: 25, page: 'telegram_education', pixel_id: PIXEL_ID, channel: TELEGRAM_CODE });
        }
        if (percent >= 0.5 && !s50) {
          s50 = true;
          fbq('trackCustom', 'ScrollDepth', { depth_percent: 50, page: 'telegram_education', pixel_id: PIXEL_ID, channel: TELEGRAM_CODE });
        }
        if (percent >= 0.75 && !s75) {
          s75 = true;
          fbq('trackCustom', 'ScrollDepth', { depth_percent: 75, page: 'telegram_education', pixel_id: PIXEL_ID, channel: TELEGRAM_CODE });
        }
      });

      // Time on page
      let startTime = Date.now();
      window.addEventListener('beforeunload', function() {
        const seconds = Math.floor((Date.now() - startTime) / 1000);
        if (seconds > 3) {
          fbq('trackCustom', 'TimeOnPage', {
            duration_seconds: seconds,
            page_type: 'Education_Subscribe_Landing',
            channel_invite: TELEGRAM_CODE,
            pixel_id: PIXEL_ID
          });
        }
      });

      // Button impression tracking
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            fbq('trackCustom', 'SubscribeButtonImpression', {
              button_id: entry.target.id,
              visible: true,
              channel_code: TELEGRAM_CODE,
              pixel_id: PIXEL_ID
            });
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });

      if (joinBtn) observer.observe(joinBtn);

      // Page fully loaded
      window.addEventListener('load', function() {
        fbq('trackCustom', 'LandingPageLoaded', {
          theme: 'blue_cyan_education',
          load_time_ms: performance.now ? Math.round(performance.now()) : 0,
          pixel_id: PIXEL_ID,
          page_type: 'telegram_education_landing',
          channel_link_active: TELEGRAM_CODE,
          auto_redirect_seconds: REDIRECT_SECONDS
        });
      });
    }

    // Final PageView with enhanced context
    if (isFbqReady()) {
      fbq('track', 'PageView', {
        page_type: 'Telegram_Education_Landing',
        creator: 'PANKAJ_BHARDWAJ',
        niche: 'Stock_Market_Education',
        telegram_channel: 'PANKAJ_BHARDWAJ_OFFICIAL',
        pixel_version: 'NEW_PIXEL_1048041471396169',
        invite_code: TELEGRAM_CODE,
        pixel_id: PIXEL_ID,
        auto_redirect: true,
        auto_redirect_seconds: REDIRECT_SECONDS
      });
    }

    // Console debug
    console.log('%c🔥 PANKAJ BHARDWAJ | NEW PIXEL + EVENT TRACKING + 6s AUTO REDIRECT ACTIVE 🔥', 'color: #00eaff; font-weight: bold; font-size: 14px;');
    console.log(`✅ NEW Pixel ID: ${PIXEL_ID}`);
    console.log(`✅ Telegram Link: ${TELEGRAM_LINK}`);
    console.log(`✅ Auto Redirect: ${REDIRECT_SECONDS} seconds`);

    // Expose debug helper
    window.pankajTracker = {
      testLead: function() {
        if (typeof fbq === 'function') {
          fbq('track', 'Lead', { test_mode: true, source: 'console_debug', channel: TELEGRAM_CODE, pixel_id: PIXEL_ID });
          console.log('✅ Test Lead event fired');
        } else { console.error('❌ fbq not available'); }
      },
      getPixelId: () => PIXEL_ID,
      getChannel: () => TELEGRAM_LINK,
      getRedirectTime: () => REDIRECT_SECONDS,
      status: () => isFbqReady() ? 'Pixel Active' : 'Pixel Not Loaded',
      triggerRedirectNow: () => { window.location.href = TELEGRAM_LINK; }
    };
  })();
</script>
