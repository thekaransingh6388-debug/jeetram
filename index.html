<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>PANKAJ BHARDWAJ · स्टॉक मार्केट शिक्षा</title>
  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b1a2a 0%, #0e1f30 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* main card – telegram landing style */
    .landing-card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px 48px 32px 32px;
      padding: 28px 22px 38px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.2);
      transition: all 0.2s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* subtle animated glow */
    .landing-card::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -30%;
      width: 160%;
      height: 160%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 215, 0, 0.03), transparent 70%);
      animation: glowDrift 12s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes glowDrift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10px, -20px) scale(1.1); }
    }

    /* logo */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #f5b042;
      box-shadow: 0 8px 25px rgba(245, 176, 66, 0.3);
      background: #1f2e3b;
      transition: transform 0.3s;
    }

    .logo-img:hover {
      transform: scale(1.02);
    }

    /* name */
    .instructor-name {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff7e6;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      margin-top: 4px;
      position: relative;
      z-index: 2;
    }

    .instructor-name span {
      color: #f5b042;
      font-weight: 300;
      display: inline-block;
    }

    .tagline {
      color: #b8cfec;
      font-size: 1rem;
      letter-spacing: 1.5px;
      background: rgba(0, 0, 0, 0.3);
      display: inline-block;
      padding: 6px 20px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      margin-top: 4px;
      margin-bottom: 12px;
      font-weight: 400;
      position: relative;
      z-index: 2;
    }

    .desc {
      color: #d4e2f5;
      font-size: 1rem;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.25);
      padding: 14px 16px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin: 10px 0 22px;
      position: relative;
      z-index: 2;
    }

    .desc i {
      color: #f5b042;
      margin-right: 6px;
    }

    /* BUTTONS section */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 20px 0 20px;
      position: relative;
      z-index: 5;
    }

    /* main big join button (center, below name) */
    .btn-primary {
      background: linear-gradient(135deg, #f5b042, #e8922a);
      border: none;
      padding: 18px 22px;
      border-radius: 80px;
      font-weight: 700;
      font-size: 1.4rem;
      color: #0b1a2a;
      box-shadow: 0 12px 30px rgba(245, 176, 66, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary i {
      font-size: 1.8rem;
      color: #0b1a2a;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 16px 40px rgba(245, 176, 66, 0.5);
      background: linear-gradient(135deg, #fcc062, #ed9e38);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    /* popup + move animation (combined) */
    .btn-pop-move {
      animation: popMove 2.6s infinite alternate ease-in-out;
      transform-origin: center;
      will-change: transform;
    }

    @keyframes popMove {
      0% { transform: scale(1) translateY(0px); }
      30% { transform: scale(1.04) translateY(-5px); }
      60% { transform: scale(0.98) translateY(3px); }
      100% { transform: scale(1.02) translateY(-4px); }
    }

    /* secondary join button (top) */
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid #f5b042;
      padding: 14px 18px;
      border-radius: 60px;
      color: #fff7e6;
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      letter-spacing: 0.3px;
    }

    .btn-secondary i {
      color: #f5b042;
      font-size: 1.5rem;
    }

    .btn-secondary:hover {
      background: rgba(245, 176, 66, 0.15);
      border-color: #fcc062;
      transform: scale(1.02);
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    .small-note {
      color: #a0bada;
      font-size: 0.75rem;
      margin-top: 24px;
      opacity: 0.8;
      letter-spacing: 0.3px;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
      padding-top: 22px;
      position: relative;
      z-index: 2;
    }

    .small-note i {
      color: #f5b042;
      margin: 0 4px;
    }

    /* FB pixel noscript fallback (invisible) */
    .fb-pixel-fallback {
      display: none;
    }

    /* responsive */
    @media (max-width: 400px) {
      .landing-card { padding: 20px 14px 30px; }
      .instructor-name { font-size: 1.8rem; }
      .btn-primary { font-size: 1.2rem; padding: 15px 16px; }
      .btn-secondary { font-size: 1rem; padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <!-- ===== MAIN LANDING CARD ===== -->
  <div class="landing-card">

    <!-- LOGO -->
    <div class="logo-wrapper">
      <img 
        src="https://karanmetalabe.com/wp-content/uploads/2026/08/images-21.jpg" 
        alt="PANKAJ BHARDWAJ Logo" 
        class="logo-img"
        loading="lazy"
      >
    </div>

    <!-- NAME (with span for styling) -->
    <div class="instructor-name">
      PANKAJ <span>BHARDWAJ</span>
    </div>

    <!-- tagline -->
    <div class="tagline">
      <i class="fas fa-chart-line" style="margin-right: 8px;"></i> स्टॉक मार्केट शिक्षा
    </div>

    <!-- description -->
    <div class="desc">
      <i class="fas fa-graduation-cap"></i> 
      सीखें, समझें, कमाएँ — विशेषज्ञ मार्गदर्शन के साथ
    </div>

    <!-- BUTTONS -->
    <div class="button-group">

      <!-- 🔹 BUTTON 1: TOP (secondary) – Join Telegram Channel -->
      <button class="btn-secondary" id="joinTopBtn">
        <i class="fab fa-telegram-plane"></i> चैनल ज्वाइन करें
      </button>

      <!-- 🔹 BUTTON 2: CENTER (primary) – big Join, below name, with pop & move animation -->
      <button class="btn-primary btn-pop-move" id="joinMainBtn">
        <i class="fab fa-telegram"></i> ज्वाइन करें
      </button>

      <!-- (optional) extra micro text -->
      <div style="font-size: 0.8rem; color: #b8cfec; opacity: 0.7; margin-top: -6px; position: relative; z-index: 2;">
        <i class="fas fa-arrow-right" style="color: #f5b042;"></i> 10,000+ छात्र
      </div>
    </div>

    <!-- footer note -->
    <div class="small-note">
      <i class="fas fa-lock"></i> 100% निःशुल्क · आज ही जुड़ें 
      <i class="fas fa-bolt" style="margin-left: 6px;"></i>
    </div>
  </div>

  <!-- ===== META PIXEL (FB) ===== -->
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '909150875148886');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none" 
      src="https://www.facebook.com/tr?id=909150875148886&ev=PageView&noscript=1"
    />
  </noscript>
  <!-- End Meta Pixel Code -->

  <!-- ===== EVENT TRACKING + TELEGRAM REDIRECT ===== -->
  <script>
    (function() {
      // Telegram channel link (provided)
      const TG_LINK = 'https://t.me/+0SnG-TRiwPkyZDg1';

      // ---------- HELPER: track FB event + redirect ----------
      function handleJoinClick(eventName = 'JoinTelegram') {
        // 1. track Facebook Pixel event (custom or standard)
        if (typeof fbq === 'function') {
          fbq('track', eventName, {
            content_name: 'Telegram_Join',
            content_category: 'StockMarket_Education',
            destination: 'Telegram_Channel'
          });
          console.log(`✅ Facebook Pixel track: ${eventName}`);
        } else {
          console.warn('⚠️ fbq not loaded yet, but redirect will happen.');
        }

        // 2. small delay to let pixel fire (50ms) then redirect
        setTimeout(() => {
          window.open(TG_LINK, '_blank');
        }, 80);
      }

      // ---------- BUTTONS ----------
      const topBtn = document.getElementById('joinTopBtn');
      const mainBtn = document.getElementById('joinMainBtn');

      // top button (secondary)
      if (topBtn) {
        topBtn.addEventListener('click', function(e) {
          e.preventDefault();
          handleJoinClick('JoinTelegram_Top');
        });
      }

      // main button (primary, with pop&move)
      if (mainBtn) {
        mainBtn.addEventListener('click', function(e) {
          e.preventDefault();
          handleJoinClick('JoinTelegram_Main');
        });
      }

      // (optional) track any extra click on card itself? but we only want buttons.
      console.log('🚀 Landing page ready — PANKAJ BHARDWAJ stock market education');
    })();
  </script>

  <!-- extra note: inline style for pixel fallback (hidden) -->
  <style>
    /* ensure pixel noscript is hidden */
    noscript img {
      display: none !important;
    }
    /* remove any default button styles */
    button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
  </style>

</body>
</html>
